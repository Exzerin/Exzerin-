<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EXZERIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --text: #14532d;
    --icon: #4fa56f;
    --icon-hover: #2f7d4f;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { height: 100%; background: var(--bg); }
  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  main { padding: 24px; }
  h1 {
    margin: 0;
    font-weight: 800;
    font-size: clamp(3rem, 14vw, 9rem);
    letter-spacing: 0.12em;
    padding-left: 0.12em; /* balances trailing letter-spacing */
    line-height: 1;
  }
  .icons {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin: 40px 0 48px;
  }
  .icons a {
    color: var(--icon);
    display: block;
    width: 34px;
    height: 34px;
    transition: color 0.2s;
  }
  .icons a:hover, .icons a:focus-visible { color: var(--icon-hover); }
  .icons a:focus-visible { outline: 2px solid var(--icon); outline-offset: 4px; border-radius: 4px; }
  .icons svg { width: 100%; height: 100%; display: block; }
  .loading {
    font-weight: 500;
    font-size: clamp(1rem, 3vw, 1.35rem);
    letter-spacing: 0.08em;
    position: relative;
    display: inline-block;
  }
  .dots { position: absolute; left: 100%; top: 0; white-space: nowrap; }
  .dots span { visibility: hidden; animation: dot 1.8s steps(1, end) infinite; }
  .dots span:nth-child(1) { animation-name: d1; }
  .dots span:nth-child(2) { animation-name: d2; }
  .dots span:nth-child(3) { animation-name: d3; }
  @keyframes d1 { 0% { visibility: visible; } 100% { visibility: visible; } }
  @keyframes d2 { 0% { visibility: hidden; } 33.33% { visibility: visible; } 100% { visibility: visible; } }
  @keyframes d3 { 0% { visibility: hidden; } 66.66% { visibility: visible; } 100% { visibility: visible; } }
  @media (prefers-reduced-motion: reduce) {
    .dots span { animation: none; visibility: visible; }
  }
</style>
</head>
